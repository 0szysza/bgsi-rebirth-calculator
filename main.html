<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebirth Calculator</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #FD7D00;
            --accent-hover: #e06e00;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --success-color: #10b981;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                url('rebirthshard.png'), 
                url('festivalcoins.png'),
                url('rebirthshard.png'),
                url('festivalcoins.png');
            background-position: 
                5% 15%, 
                85% 20%, 
                15% 80%, 
                90% 75%;
            background-size: 80px, 90px, 75px, 85px;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Responsive background for mobile */
        @media (max-width: 768px) {
            body {
                background-size: 40px, 45px, 35px, 40px;
            }
        }

        .calculator-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 0 30px rgba(253, 125, 0, 0.05);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
        }

        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #070a12;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(253, 125, 0, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #070a12;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .result-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .result-display-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .coin-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            word-break: break-all;
        }

        .result-formatted {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-top: 5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Rebirth Calculator</h1>
        
        <div class="input-group">
            <label for="currentRebirths">Total Rebirths Count:</label>
            <input type="number" id="currentRebirths" value="0" min="0">
        </div>

        <div class="input-group">
            <label for="currentCurrency">Current Rebirth Shards:</label>
            <input type="number" id="currentCurrency" value="0" min="0">
        </div>

        <div class="input-group">
            <label for="targetCurrency">Target Rebirth Shards:</label>
            <input type="number" id="targetCurrency" value="1" min="1">
        </div>

        <button onclick="calculateCoins()">Calculate Cost</button>

        <div class="result-box" id="resultBox">
            <div class="result-title">Required Coins:</div>
            <div class="result-display-wrapper">
                <img src="festivalcoins.png" alt="Coins" class="coin-icon" onerror="this.style.display='none'">
                <div>
                    <div class="result-value" id="rawResult">0</div>
                    <div class="result-formatted" id="formattedResult">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatCoins(amount) {
            if (amount === 0) return "0 coins";
            
            const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi"];
            let suffixIndex = 0;
            let shortAmount = amount;

            while (shortAmount >= 1000 && suffixIndex < suffixes.length - 1) {
                shortAmount /= 1000;
                suffixIndex++;
            }

            const formattedNumber = Math.round(shortAmount * 100) / 100;
            return `${formattedNumber.toLocaleString('en-US')} ${suffixes[suffixIndex]} coins`;
        }

        function calculateCoins() {
            const currentRebirths = parseInt(document.getElementById('currentRebirths').value) || 0;
            const currentCurrency = parseInt(document.getElementById('currentCurrency').value) || 0;
            const targetCurrency = parseInt(document.getElementById('targetCurrency').value) || 0;

            const resultBox = document.getElementById('resultBox');
            const rawResultDisplay = document.getElementById('rawResult');
            const formattedResultDisplay = document.getElementById('formattedResult');

            if (targetCurrency <= currentCurrency) {
                rawResultDisplay.innerText = "Target already reached!";
                formattedResultDisplay.innerText = "";
                resultBox.classList.add('show');
                return;
            }

            const currencyNeeded = targetCurrency - currentCurrency;
            let totalCoins = 0;
            
            const BASE_COST = 10000000000; 
            const SCALE_COST = 250000000; 

            for (let i = 0; i < currencyNeeded; i++) {
                const currentStepIndex = currentRebirths + currentCurrency + i;
                const costForThisPoint = BASE_COST + (currentStepIndex * SCALE_COST);
                totalCoins += costForThisPoint;
            }

            rawResultDisplay.innerText = totalCoins.toLocaleString('en-US');
            formattedResultDisplay.innerText = formatCoins(totalCoins);
            resultBox.classList.add('show');
        }
    </script>
</body>
</html>
